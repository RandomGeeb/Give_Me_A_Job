<!doctype html><meta charset=utf-8><title>Mock</title>
<form id=f action="/submit" method=post>
<div class=field-wrapper><label for=first_name>First Name*</label><input id=first_name required></div>
<div class=field-wrapper><label for=email>Email*</label><input id=email type=email required></div>
<div class=select><label id=deg-label for=deg>Degree<span>*</span></label><input id=deg role=combobox aria-required=true aria-labelledby=deg-label aria-controls=deg-list autocomplete=off><div id=deg-list role=listbox hidden></div></div>
<div class=field-wrapper><label for=why>Why this team?*</label><textarea id=why required></textarea></div>
<div class=ashby-application-form-field-entry data-field-entry-id=a1><label class=ashby-application-form-question-title>Will you need visa sponsorship?</label><div class=_yesno_1><button type=button onclick="this.parentElement.dataset.v='Yes'">Yes</button><button type=button onclick="this.parentElement.dataset.v='No'">No</button><input type=checkbox name=yn style="display:none"></div></div>
<fieldset class=ashby-application-form-field-entry><label class=ashby-application-form-question-title>Languages used</label>
<input type=checkbox id=q_1-labeled-checkbox-0 name=Python><label for=q_1-labeled-checkbox-0>Python</label>
<input type=checkbox id=q_1-labeled-checkbox-1 name=Java><label for=q_1-labeled-checkbox-1>Java</label></fieldset>
<li class=application-question><div class=application-label>Are you authorised to work in the UK?<span class=required>✱</span></div><label><input type=radio name=auth value=Yes required>Yes</label><label><input type=radio name=auth value=No>No</label></li>
<li class=application-question><div class=application-label>Gender</div><label><input type=radio name=g value=Woman>Woman</label><label><input type=radio name=g value=Man>Man</label></li>
<div class=field-wrapper><label for=dob>Date of birth*</label><input id=dob required></div>
<div class=field-wrapper><label><input type=checkbox name=consent required>I agree to the privacy policy</label></div>
<div class=field-wrapper><label for=resume>Resume/CV</label><input type=file id=resume></div>
<input name=honeypot style="position:absolute;left:-9999px"><textarea name=g-recaptcha-response></textarea>
<button id=go type=submit>Submit</button></form>
<script>
window.submits=0;f.addEventListener('submit',e=>{e.preventDefault();window.submits++});
const i=deg,l=document.getElementById('deg-list'),O=["Bachelor's Degree","Master's Degree"];
const show=()=>{l.hidden=false;l.innerHTML='';O.filter(o=>o.toLowerCase().includes(i.value.toLowerCase())).forEach(o=>{const d=document.createElement('div');d.role='option';d.textContent=o;d.onclick=()=>{i.value=o;l.hidden=true};l.append(d)})};
i.onclick=show;i.oninput=show;i.onkeydown=e=>{if(e.key=='Escape')l.hidden=true};
</script>
