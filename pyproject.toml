[project]
name = "jobbot"
version = "0.1.0"
description = "Find, tailor, review and track UK tech internship applications"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "httpx",
  "playwright",
  "pydantic>=2",
  "pypdf",
  "python-multipart",
  "pyyaml",
  "uvicorn",
]

[project.scripts]
jobbot = "jobbot.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/jobbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
